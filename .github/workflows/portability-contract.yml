name: Portability contract

on:
  push:
  pull_request:

jobs:
  key-manager-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install function dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: API Key Manager behavior
        run: python -m unittest discover -s tests -p 'test_key_manager_behavior.py' -v

  powershell-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Profile contract
        shell: pwsh
        run: ./tests/profile-contract.ps1
      - name: Script portability contract
        shell: pwsh
        run: ./tests/script-portability.ps1
      - name: API Key Manager contract
        shell: pwsh
        run: ./tests/key-manager-contract.ps1
      - name: Model alias contract
        shell: pwsh
        run: ./tests/model-lab-contract.ps1
      - name: Model alias behavior
        shell: pwsh
        run: ./tests/model-lab-behavior.ps1
      - name: Model rename behavior
        shell: pwsh
        run: ./tests/rename-model-behavior.ps1
      - name: Privacy script contract
        shell: pwsh
        run: ./tests/privacy-contract.ps1
      - name: Provisioning contract
        shell: pwsh
        run: ./tests/provision-contract.ps1
      - name: Provisioning contract (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/provision-contract.ps1

  compose-contract:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ci-only-password
      LITELLM_MASTER_KEY: sk-ci-master-key
      LITELLM_SALT_KEY: sk-ci-salt-key-abcdef1234567890
      WEBUI_SECRET_KEY: ci-only-webui-secret
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: admin
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 10m
    steps:
      - uses: actions/checkout@v4
      - name: Configuration contract
        shell: pwsh
        run: ./tests/config-contract.ps1
      - name: Proxy contract
        shell: pwsh
        run: ./tests/proxy-contract.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Privacy topology and Compose checks
        run: python -m unittest discover -s tests -p 'test_privacy.py' -v
