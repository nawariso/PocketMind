# PocketMind shared-pilot reverse proxy (HTTP only, no certificate required).
#
#   :8080 (host PROXY_WEBUI_PORT) -> Open WebUI, everything.
#   :8081 (host PROXY_API_PORT)   -> LiteLLM, ONLY the inference endpoints listed below.
#
# Everything else on the API port (/ui, /key, /model, /team, /user, /openapi.json, /metrics, ...) is a 404,
# so the LiteLLM administration surface is never reachable through this proxy.
#
# Optional local rules go in nginx/local/*.conf (git-ignored). They are included inside both servers, e.g.
# to limit clients to your network:   allow 10.0.0.0/8;  deny all;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    # Base64 images for OCR and file uploads exceed nginx's 1 MB default.
    client_max_body_size 50m;

    # Containers are recreated often. Resolve names at request time through Docker's DNS so a recreated
    # LiteLLM or Open WebUI is found without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The API port is limited per client address. Open WebUI is limited only on its sign-in/session
    # endpoints (to slow password guessing); an empty key means "not limited", so page assets are free.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    map $uri $login_limit_key {
        ~^/api/v1/auths/ $binary_remote_addr;
        default          "";
    }
    limit_req_zone $login_limit_key zone=login:10m rate=2r/s;
    limit_req_status 429;

    server {
        listen 8080 default_server;
        include /etc/nginx/local/*.conf;
        limit_req zone=login burst=10 nodelay;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            set $webui http://open-webui:8080;
            proxy_pass $webui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # socket.io websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8081 default_server;
        include /etc/nginx/local/*.conf;
        limit_req zone=api burst=60 nodelay;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Inference endpoints only. The path that matched is the path forwarded ($uri), so what is
        # allowed and what LiteLLM receives cannot differ.
        location ~ ^/v1/(chat/completions|completions|embeddings|responses|models(/[^/]+)?)$ {
            # OPTIONS is allowed so browser-based clients can complete a CORS preflight.
            limit_except GET POST OPTIONS {
                deny all;
            }
            set $litellm http://litellm:4000;
            proxy_pass $litellm$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # Server-sent events must reach the client as they are produced.
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location / {
            return 404;
        }
    }
}
