name: pocketmind

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: pocketmind-postgres
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ai-net]

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm-database:v1.96.0}
    container_name: pocketmind-litellm
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "False"
      DO_NOT_TRACK: "true"
      LITELLM_LOG: "WARNING"
      OLLAMA_API_BASE: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [ai-net]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9}
    container_name: pocketmind-open-webui
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OPENAI_API_PASSTHROUGH: "false"
      # These defaults reduce external integrations; stored Admin settings may override some of them.
      # PRIVACY_MODE adds offline settings and backend network isolation after model preparation.
      ENABLE_VERSION_UPDATE_CHECK: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_DIRECT_INTEGRATIONS: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_OTEL: "false"
      ENABLE_OTEL_TRACES: "false"
      ENABLE_OTEL_METRICS: "false"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"
      RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "false"
      RAG_RERANKING_MODEL_TRUST_REMOTE_CODE: "false"
      # Optional first-start administrator. Without it, the first person to open Open WebUI becomes administrator.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      # Accounts created or signing in later are approved at once with the user role (applies to a new database;
      # Open WebUI keeps the stored value afterwards, change it in Admin Panel -> Settings -> General).
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-user}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [ai-net]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    container_name: pocketmind-prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.native.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    configs:
      - source: litellm_token
        target: /etc/prometheus/litellm_token
    extra_hosts:
      - "host.docker.internal=host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ai-net]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    container_name: pocketmind-grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ai-net]

networks:
  ai-net:
    driver: bridge

configs:
  litellm_token:
    content: ${LITELLM_MASTER_KEY}

volumes:
  postgres_data:
  openwebui_data:
  prometheus_data:
  grafana_data:
