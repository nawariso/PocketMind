global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm_token
    static_configs:
      - targets:
          - litellm:4000
        labels:
          stack: pocketmind

  # Host metrics from node_exporter running on the Mac (bound to 127.0.0.1:9100).
  - job_name: host
    static_configs:
      - targets:
          - host.docker.internal:9100
        labels:
          stack: pocketmind
