global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm_token
    static_configs:
      - targets:
          - litellm:4000
        labels:
          stack: pocketmind

  - job_name: nvidia_gpu
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - nvidia-exporter:9835
        labels:
          stack: pocketmind
